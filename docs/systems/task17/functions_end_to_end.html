<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Function End to End</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Layout idea: a lesson player. Lesson list on the left; on the right a stage diagram,
   the Python that drives it, its output, and a step table that plays in sync. */
:root{
  --paper:#f2f5f1; --panel:#ffffff; --ink:#14262b; --muted:#5a6c6f; --line:#cfd9d4;
  --accent:#d97706; --accent-soft:#fdebcf; --blue:#1c6e8c; --blue-soft:#e1f0f5;
  --good:#2e7d4f; --bad:#c0392b; --bad-soft:#fbe6e2; --code:#eef2ee;
  --display:"Bricolage Grotesque","Trebuchet MS",sans-serif;
  --body:"IBM Plex Sans","Segoe UI",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#0f1b1e; --panel:#16272a; --ink:#e6efec; --muted:#93a8a7; --line:#2b4043;
    --accent:#f2a33a; --accent-soft:#4a3410; --blue:#62b8d6; --blue-soft:#143540;
    --good:#6fcf97; --bad:#f0776a; --bad-soft:#47201c; --code:#11201f; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0f1b1e; --panel:#16272a; --ink:#e6efec; --muted:#93a8a7; --line:#2b4043;
  --accent:#f2a33a; --accent-soft:#4a3410; --blue:#62b8d6; --blue-soft:#143540;
  --good:#6fcf97; --bad:#f0776a; --bad-soft:#47201c; --code:#11201f; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font:16px/1.5 var(--body);
  background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);
  background-size:32px 32px;background-attachment:fixed}
body::before{content:"";position:fixed;inset:0;background:var(--paper);opacity:.86;pointer-events:none;z-index:0}
.app{position:relative;z-index:1;max-width:1320px;margin:0 auto;padding:20px;display:grid;grid-template-columns:236px minmax(0,1fr);gap:24px}
.bar{grid-column:1/-1;display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 16px;border-bottom:2px solid var(--ink);padding-bottom:12px}
.bar b{font:700 22px/1.1 var(--display);letter-spacing:-.01em}
.bar span{font:500 12px var(--mono);color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
nav{position:sticky;top:16px;align-self:start;display:flex;flex-direction:column;gap:16px;max-height:calc(100vh - 32px);overflow:auto;padding-right:4px}
.grp h2{font:600 11px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:0 0 6px}
.grp{display:flex;flex-direction:column;gap:2px}
nav button{all:unset;cursor:pointer;padding:6px 10px;border-radius:6px;font:500 14.5px var(--body);border-left:3px solid transparent}
nav button:hover{background:var(--panel)}
nav button[aria-current="true"]{background:var(--panel);border-left-color:var(--accent);font-weight:600}
button:focus-visible,select:focus-visible,a:focus-visible,tr:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
main{display:flex;flex-direction:column;gap:18px;min-width:0}
.kick{font:600 12px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--accent)}
h1{font:700 clamp(28px,4vw,40px)/1.05 var(--display);letter-spacing:-.02em;margin:4px 0 8px;text-wrap:balance}
.blurb{max-width:65ch;margin:0;color:var(--muted)}
.row{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(0,1fr);gap:18px}
.panel{background:var(--panel);border:1.5px solid var(--ink);border-radius:10px;min-width:0}
.ph{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 14px;border-bottom:1.5px solid var(--ink);font:600 11px var(--mono);letter-spacing:.1em;text-transform:uppercase}
.stagewrap{overflow-x:auto}
svg#stage{display:block;width:100%;min-width:620px;height:auto}
.say{margin:0;padding:12px 14px;border-top:1.5px solid var(--ink);min-height:4.2em;font-size:15.5px}
.say b{color:var(--accent)}
dl{margin:0;padding:6px 14px 12px}
dl div{display:grid;grid-template-columns:104px 1fr;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
dl div:last-child{border:0}
dt{font:600 11px/1.6 var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
dd{margin:0}
code,.c{font-family:var(--mono);font-size:.92em}
dd code{background:var(--code);padding:1px 5px;border-radius:4px}
.ctl{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.ctl button,.ctl select{font:600 13px var(--mono);letter-spacing:.04em;padding:8px 14px;border:1.5px solid var(--ink);border-radius:8px;background:var(--panel);color:var(--ink);cursor:pointer}
.ctl button.pri{background:var(--ink);color:var(--paper);min-width:96px}
.ctl button:disabled{opacity:.4;cursor:default}
.ctl .prog{font:500 13px var(--mono);color:var(--muted);margin:0 6px;font-variant-numeric:tabular-nums}
.ctl .next{margin-left:auto}
pre{margin:0;padding:10px 0;overflow-x:auto;font:14px/1.75 var(--mono);background:var(--code);border-radius:0 0 8px 8px}
.ln{display:block;padding:0 14px 0 0;border-left:3px solid transparent;white-space:pre;min-width:max-content}
.ln i{display:inline-block;width:38px;text-align:right;margin-right:14px;color:var(--muted);font-style:normal;opacity:.7;user-select:none}
.ln.on{background:var(--accent-soft);border-left-color:var(--accent)}
.k{color:var(--blue);font-weight:600}.s{color:var(--good)}.m{color:var(--muted);font-style:italic}.n{color:var(--accent)}
#out{min-height:120px;white-space:pre-wrap;padding:12px 14px}
#out .new{background:var(--accent-soft);border-radius:3px}
#out em{color:var(--muted);font-family:var(--body);font-style:normal}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th{font:600 11px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);text-align:left;padding:8px 14px}
td{padding:7px 14px;border-top:1px solid var(--line);vertical-align:top}
td:first-child,td:nth-child(2){font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
td:last-child{font-family:var(--mono);white-space:pre-wrap}
tbody tr{cursor:pointer}
tbody tr:hover{background:var(--code)}
tbody tr.on{background:var(--accent-soft)}
tbody tr.done td:first-child{color:var(--good)}
.ex ul{list-style:none;margin:0;padding:6px 14px 12px}
.ex li{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px solid var(--line);font-size:15px}
.ex li:last-child{border:0}
.ex input{width:17px;height:17px;margin-top:3px;accent-color:var(--accent)}
.ex a{color:var(--blue);font-weight:600;white-space:nowrap}
/* stage */
.lbl{font:600 11px var(--mono);letter-spacing:.12em;fill:var(--muted)}
.tok rect{fill:var(--panel);stroke:var(--ink);stroke-width:1.5}
.tok text{font:500 15px var(--mono);fill:var(--ink)}
.tok.used{opacity:.3}
.tok.out rect{fill:var(--accent-soft);stroke:var(--accent)}
.tok.live rect{stroke:var(--accent);stroke-width:2.6}
.tok.ghost rect{fill:none;stroke:var(--bad);stroke-dasharray:4 4}
.tok.ghost text{fill:var(--bad)}
.mach rect{fill:var(--blue-soft);stroke:var(--blue);stroke-width:2}
.mach.hot rect{fill:var(--accent-soft);stroke:var(--accent)}
.mach .f{font:600 17px var(--mono);fill:var(--ink)}
.mach .big{font:700 34px var(--display);fill:var(--ink)}
.mach .e{font:500 14px var(--mono);fill:var(--muted)}
.arrow{stroke:var(--muted);stroke-width:1.5;fill:none;stroke-dasharray:3 5}
.edge{stroke:var(--muted);stroke-width:1.6;stroke-dasharray:6 6;opacity:.7}
.node>rect{fill:var(--panel);stroke:var(--ink);stroke-width:1.6}
.node.good>rect{stroke:var(--good);stroke-width:2.4}
.node.bad>rect{stroke:var(--bad);fill:var(--bad-soft);stroke-width:2.4}
.node.hot>rect{stroke:var(--accent);fill:var(--accent-soft);stroke-width:2.4}
.node.ghost>rect{stroke-dasharray:6 6;fill:none}
.node.ghost .t,.node.ghost .u{opacity:.45}
.node .t{font:600 15px var(--body);fill:var(--ink)}
.node .u{font:500 11.5px var(--mono);fill:var(--muted)}
.badge rect{fill:var(--ink)}
.badge text{font:600 11.5px var(--mono);fill:var(--paper)}
.dot{fill:none;stroke:var(--muted);stroke-width:1.2}
.dot.on{fill:var(--blue);stroke:var(--blue)}
.over{font:600 12px var(--mono);fill:var(--bad)}
.pk rect{fill:var(--accent)}
.pk text{font:600 12px var(--mono);fill:#1a1206}
.pk.bad rect{fill:var(--bad)}
.pk.bad text{fill:#fff}
@media (max-width:920px){
  .app{grid-template-columns:minmax(0,1fr);padding:16px}
  nav{position:static;flex-direction:row;max-height:none;overflow-x:auto;padding-bottom:6px}
  .grp{flex:none}
  .row{grid-template-columns:minmax(0,1fr)}
  .ctl .next{margin-left:0}
}
</style>
</head>
<body>
<div class="app">
  <header class="bar"><b>Function, end to end</b><span>Class of 9 Nov 2026 · every idea played out in Python</span></header>
  <nav id="nav" aria-label="Lessons"></nav>
  <main>
    <section>
      <div class="kick" id="kick"></div>
      <h1 id="title"></h1>
      <p class="blurb" id="blurb"></p>
    </section>
    <div class="row">
      <div class="panel">
        <div class="ph"><span>Stage</span><span id="prog2"></span></div>
        <div class="stagewrap"><svg id="stage" viewBox="0 0 800 380" role="img" aria-label="Animated diagram of the current lesson"></svg></div>
        <p class="say" id="say" aria-live="polite"></p>
      </div>
      <div class="panel">
        <div class="ph"><span>In short</span></div>
        <dl id="facts"></dl>
      </div>
    </div>
    <div class="ctl">
      <button id="bPlay" class="pri" type="button">Play</button>
      <button id="bBack" type="button">Back</button>
      <button id="bStep" type="button">Step</button>
      <button id="bReset" type="button">Restart</button>
      <label class="prog" for="speed">Speed</label>
      <select id="speed"><option value="0.5">0.5×</option><option value="1" selected>1×</option><option value="2">2×</option></select>
      <span class="prog" id="prog"></span>
      <button id="bNext" class="next" type="button">Next lesson →</button>
    </div>
    <div class="row">
      <div class="panel"><div class="ph"><span>Python</span><span id="fname"></span></div><pre id="code"></pre></div>
      <div class="panel"><div class="ph"><span>Output</span></div><div id="out" class="c"></div></div>
    </div>
    <div class="panel">
      <div class="ph"><span>Step by step</span><span>click a row to jump</span></div>
      <div class="tw"><table><thead><tr><th>No.</th><th>Line</th><th>What happens</th><th>Prints</th></tr></thead><tbody id="rows"></tbody></table></div>
    </div>
    <div class="panel ex">
      <div class="ph"><span>Practice assigned in class</span></div>
      <ul id="ex"></ul>
    </div>
  </main>
</div>
<script>
/* ---------- lesson data ---------- */
const items=(r,n,line,say)=>Array.from({length:n},(_,i)=>({r,i,line,say:say(i)}));
const marks=[35,48,62,71,90], word=['V','i','z','a','g'], codes=[86,105,122,97,103];
const three=['client','guard','server'];
function chain(mid,midSub,client){return{
  nodes:[{id:'c',x:110,y:190,label:'client',sub:client||''},{id:'m',x:390,y:190,label:mid,sub:midSub,w:180},{id:'s',x:670,y:190,label:'server',sub:''}],
  edges:[['c','m'],['m','s']]};}

const LESSONS=[
{id:'higher-order',topic:'1 · Working with functions',title:'Higher-order functions',file:'apply.py',
 blurb:'A higher-order function takes another function as one of its inputs. The same value gives a different answer depending on which function you hand over.',
 facts:[['Idea','A function is a value. You can pass it as an argument, like a number or a string.'],['Not only Python','JavaScript, Go, C (function pointers) and most other languages allow the same thing.'],['Watch for','<code>len</code> is passed without brackets. <code>len()</code> would call it; <code>len</code> hands it over.']],
 code:`def apply(fn, value):
    return fn(value)

print(apply(len, "vizag"))
print(apply(str.upper, "vizag"))
print(apply(lambda s: s[::-1], "vizag"))`,
 scene:'pipe',cap:'apply(fn, value)',
 rounds:[{fns:['len','str.upper','lambda s: s[::-1]'],ins:["'vizag'","'vizag'","'vizag'"],outs:['5',"'VIZAG'","'gaziv'"]}],
 steps:[{r:0,i:0,line:[1,2,4],out:'5',say:'<b>len</b> is handed to apply as fn. Inside, fn("vizag") runs len and counts 5 letters.'},
        {r:0,i:1,line:[1,2,5],out:'VIZAG',say:'Same apply, same value, different function. <b>str.upper</b> returns the capitals.'},
        {r:0,i:2,line:[1,2,6],out:'gaziv',say:'A <b>lambda</b> written on the spot is passed in. It reverses the string.'}]},

{id:'map',topic:'1 · Working with functions',title:'map',file:'map_demo.py',
 blurb:'map runs one function on every item of a list, one at a time, and gives back the results in the same order.',
 facts:[['Takes','A function and a list (any iterable).'],['Gives','One result per item. Five in, five out.'],['In Python 3','<code>map</code> is lazy. Wrap it in <code>list()</code> to see the values.']],
 code:`marks = [35, 48, 62, 71, 90]

def add_grace(m):
    return m + 5

result = list(map(add_grace, marks))
print(result)`,
 scene:'pipe',cap:'map(fn, marks)',
 rounds:[{fn:'add_grace',ins:marks,outs:marks.map(m=>m+5)}],
 steps:[...items(0,5,[3,4,6],i=>`add_grace(${marks[i]}) returns <b>${marks[i]+5}</b>.`),
        {r:0,i:4,line:7,out:'[40, 53, 67, 76, 95]',say:'Every student got 5 grace marks. The original marks list is unchanged.'}]},

{id:'filter',topic:'1 · Working with functions',title:'filter',file:'filter_demo.py',
 blurb:'filter asks a function a yes or no question about every item and keeps only the items that get a yes.',
 facts:[['Takes','A function that returns True or False, and a list.'],['Gives','The same items, fewer of them. Nothing is changed, only kept or dropped.'],['Here','The question is written inline as a lambda: is the mark 50 or more?']],
 code:`marks = [35, 48, 62, 71, 90]

passed = list(filter(lambda m: m >= 50, marks))
print(passed)`,
 scene:'pipe',cap:'filter(fn, marks)',
 rounds:[{fn:'lambda m: m >= 50',ins:marks,outs:marks.map(m=>m>=50?m:null)}],
 steps:[...items(0,5,3,i=>marks[i]>=50?`${marks[i]} >= 50 is <b>True</b>. Kept.`:`${marks[i]} >= 50 is <b>False</b>. Dropped.`),
        {r:0,i:4,line:4,out:'[62, 71, 90]',say:'Three of five passed. filter never edits an item, it only decides who stays.'}]},

{id:'lambda',topic:'1 · Working with functions',title:'lambda, the anonymous function',file:'lambda_demo.py',
 blurb:'A lambda is a small function with no name, written right where it is used. It does the same job as a short def.',
 facts:[['Shape','<code>lambda inputs: one expression</code>. The expression is the return value.'],['Use it when','The function is one line and needed once, usually inside map, filter or reduce.'],['Use def when','The logic needs a name, several lines, or reuse.']],
 code:`def square(x):
    return x * x

nums = [1, 2, 3, 4]
print(list(map(square, nums)))
print(list(map(lambda x: x * x, nums)))`,
 scene:'pipe',cap:'map(fn, nums)',
 rounds:[{fn:'square',ins:[1,2,3,4],outs:[1,4,9,16]},{fn:'lambda x: x * x',ins:[1,2,3,4],outs:[1,4,9,16]}],
 steps:[...items(0,4,[1,2,5],i=>`The named function square(${i+1}) returns <b>${(i+1)*(i+1)}</b>.`).map((s,i)=>i==3?{...s,out:'[1, 4, 9, 16]'}:s),
        ...items(1,4,6,i=>`The lambda gets ${i+1} and returns <b>${(i+1)*(i+1)}</b>. Same work, no name.`).map((s,i)=>i==3?{...s,out:'[1, 4, 9, 16]'}:s)]},

{id:'reduce-lambda',topic:'1 · Working with functions',title:'reduce: factorial with a lambda',file:'factorial_lambda.py',
 blurb:'reduce combines a whole list down to one value. It carries a running result (acc) and folds in one item at a time.',
 facts:[['From','<code>functools</code>. It is not a built-in, so import it.'],['The function','Takes two inputs: the running result and the next item.'],['Factorial','5! = 1 × 2 × 3 × 4 × 5 = 120'],['Shortcut','<code>operator.mul</code> is the standard library\'s ready-made <code>*</code> function.']],
 code:`from functools import reduce

n = 5
nums = list(range(1, n + 1))

fact = reduce(lambda acc, x: acc * x, nums)
print(fact)`,
 scene:'reduce',fn:'lambda acc, x: acc * x',nums:[1,2,3,4,5],
 steps:[{i:-1,line:[3,4],say:'range(1, n + 1) stops before n + 1, so the list is 1 to 5.'},
        {i:0,acc:1,expr:'first item becomes acc',line:6,say:'No starting value was given, so reduce takes the first item, <b>1</b>, as acc.'},
        {i:1,acc:2,expr:'1 * 2 = 2',line:6,say:'The lambda gets acc = 1 and x = 2. It returns <b>2</b>, the new acc.'},
        {i:2,acc:6,expr:'2 * 3 = 6',line:6,say:'acc = 2, x = 3. New acc is <b>6</b>.'},
        {i:3,acc:24,expr:'6 * 4 = 24',line:6,say:'acc = 6, x = 4. New acc is <b>24</b>.'},
        {i:4,acc:120,expr:'24 * 5 = 120',line:6,say:'acc = 24, x = 5. New acc is <b>120</b>. The list is used up.'},
        {i:4,acc:120,expr:'24 * 5 = 120',line:7,out:'120',say:'One value is left. That is 5 factorial.'}]},

{id:'reduce-named',topic:'1 · Working with functions',title:'reduce: factorial with a named function',file:'factorial_named.py',
 blurb:'The same factorial, with def in place of the lambda. reduce does not care how the function was made, only that it takes two inputs.',
 facts:[['Changed','Only the function. <code>multiply</code> has a name and can be reused or tested alone.'],['Same','The list, the order of steps and the answer.'],['Passing it','<code>reduce(multiply, nums)</code>, without brackets after multiply.']],
 code:`from functools import reduce

def multiply(acc, x):
    return acc * x

n = 5
nums = list(range(1, n + 1))

fact = reduce(multiply, nums)
print(fact)`,
 scene:'reduce',fn:'multiply',nums:[1,2,3,4,5],
 steps:[{i:-1,line:[6,7],say:'The same list, 1 to 5.'},
        {i:0,acc:1,expr:'first item becomes acc',line:9,say:'reduce takes the first item, <b>1</b>, as acc.'},
        {i:1,acc:2,expr:'multiply(1, 2) = 2',line:[3,4,9],say:'reduce calls multiply(1, 2). It returns <b>2</b>.'},
        {i:2,acc:6,expr:'multiply(2, 3) = 6',line:[3,4,9],say:'multiply(2, 3) returns <b>6</b>.'},
        {i:3,acc:24,expr:'multiply(6, 4) = 24',line:[3,4,9],say:'multiply(6, 4) returns <b>24</b>.'},
        {i:4,acc:120,expr:'multiply(24, 5) = 120',line:[3,4,9],say:'multiply(24, 5) returns <b>120</b>.'},
        {i:4,acc:120,expr:'multiply(24, 5) = 120',line:10,out:'120',say:'Same answer as the lambda version.'}]},

{id:'ascii',topic:'1 · Working with functions',title:'String to ASCII and back',file:'ascii_roundtrip.py',
 blurb:'A string is a list of letters, so map works on it. ord turns a letter into its number; chr turns the number back.',
 facts:[['ord','Letter to number. <code>ord("V")</code> is 86.'],['chr','Number to letter. <code>chr(86)</code> is "V".'],['join','<code>"".join(...)</code> glues the letters back into one string.'],['Notice','Capital V is 86, small letters start at 97.']],
 code:`word = "Vizag"

codes = list(map(ord, word))
print(codes)

back = "".join(map(chr, codes))
print(back)`,
 scene:'pipe',cap:'map(fn, ...)',
 rounds:[{fn:'ord',ins:word.map(c=>`'${c}'`),outs:codes},{fn:'chr',ins:codes,outs:word.map(c=>`'${c}'`)}],
 steps:[...items(0,5,3,i=>`ord('${word[i]}') is <b>${codes[i]}</b>.`),
        {r:0,i:4,line:4,out:'[86, 105, 122, 97, 103]',say:'The word is now a list of numbers.'},
        ...items(1,5,6,i=>`chr(${codes[i]}) is <b>'${word[i]}'</b>.`),
        {r:1,i:4,line:7,out:'Vizag',say:'join glues the five letters together. The original string is back.'}]},

{id:'sources',topic:'2 · Linking and libraries',title:'Where a function comes from',file:'three_sources.py',
 blurb:'Every function you call was written by someone. There are three places it can come from, in any language.',
 facts:[['Your own','You write it. <code>def area(r)</code>'],['Standard library','Ships with the language. <code>import math</code> needs no install.'],['Third-party','Written by others, installed separately. <code>pip install requests</code>']],
 code:`def area(r):                  # 1. written by you
    return 3.14159 * r * r

import math                   # 2. standard library
import requests               # 3. third-party: pip install requests

print(area(2))
print(math.sqrt(144))
print(requests.get("https://api.github.com").status_code)`,
 scene:'graph',

 code:`LIMIT = 3            # requests allowed per time window
hits = {}            # ip -> requests seen in this window

    hits[ip] = hits.get(ip, 0) + 1

    status = 200 if allow("10.0.0.7") else 429
    print(f"request {n}: {status}")`,

{id:'ip-block',topic:'4 · Protecting a server',title:'Temporary IP block',file:'ip_block.py',
 blurb:'A client that goes over the limit can be shut out completely for a while. Every request from that IP is refused until the block ends. GitHub was the example given in class.',
 facts:[['Trigger','The client crosses the rate limit.'],['Effect','Its source IP is refused for a set time, here 60 seconds.'],['After','The block expires on its own and the client starts fresh.']],
 code:`LIMIT, BLOCK_SECONDS = 3, 60
hits, blocked_until = {}, {}

def check(ip, now):
    if now < blocked_until.get(ip, 0):
        return "403 blocked"
    hits[ip] = hits.get(ip, 0) + 1
    if hits[ip] > LIMIT:
        blocked_until[ip] = now + BLOCK_SECONDS
        hits[ip] = 0
        return "429 too many, blocked for 60s"
    return "200 OK"

for now in [0, 1, 2, 3, 10, 70]:
    print(f"t={now}s", check("10.0.0.7", now))`,
 scene:'graph',...chain('guard','limit 3, block 60s','10.0.0.7'),
 init:{m:{badge:'0 of 3 used'}},

  [...$('rows').children].forEach((r,i)=>{r.className=i===k?'on':i<k?'done':'';});
  const total=cur.steps.length,txt=`step ${Math.max(k+1,0)} of ${total}`;$('prog').textContent=txt;$('prog2').textContent=txt;
  $('bBack').disabled=k<0;$('bStep').disabled=k>=total-1;
  $('bPlay').textContent=playing?'Pause':k>=total-1?'Replay':'Play';
}
async function show(n,anim){epoch++;k=n;chrome();await scenes[cur.scene](cur,n,anim&&!still);}
function stop(){playing=false;runId++;if(cur)chrome();}
async function play(){
  const id=++runId;playing=true;
  if(k>=cur.steps.length-1)await show(-1,false);else chrome();
  await sleep(350);
  while(id===runId&&k<cur.steps.length-1){await show(k+1,true);if(id!==runId)return;await sleep(900/speed);}
  if(id===runId){playing=false;chrome();}
}
function open(id,auto){
  const L=LESSONS.find(l=>l.id===id)||LESSONS[0];stop();cur=L;
  $('kick').textContent='Topic '+L.topic;$('title').textContent=L.title;$('blurb').textContent=L.blurb;$('fname').textContent=L.file;
  $('facts').innerHTML=L.facts.map(([a,b])=>`<div><dt>${a}</dt><dd>${b}</dd></div>`).join('');
  $('code').innerHTML=L.code.split('\n').map((l,i)=>`<span class="ln"><i>${i+1}</i>${hl(l)}</span>`).join('');
  $('rows').innerHTML=L.steps.map((s,i)=>{const ln=[].concat(s.line);return `<tr tabindex="0" data-i="${i}"><td>${i+1}</td><td>${ln.length?ln.length>1?ln[0]+'–'+ln[ln.length-1]:ln[0]:'–'}</td><td>${s.say.replace(/<\/?b>/g,'')}</td><td>${s.out?esc(s.out):''}</td></tr>`;}).join('');
  document.querySelectorAll('nav button').forEach(b=>b.setAttribute('aria-current',b.dataset.id===L.id));
  const ix=LESSONS.indexOf(L);$('bNext').disabled=ix===LESSONS.length-1;
  if(location.hash.slice(1)!==L.id){try{history.replaceState(null,'','#'+L.id);}catch(e){location.hash=L.id;}}
  show(-1,false);if(auto&&!still)play();
}
/* build nav + exercises */
(function(){const groups={};LESSONS.forEach(l=>(groups[l.topic]=groups[l.topic]||[]).push(l));
  $('nav').innerHTML=Object.keys(groups).map(t=>`<div class="grp"><h2>${t}</h2>${groups[t].map(l=>`<button type="button" data-id="${l.id}">${l.title}</button>`).join('')}</div>`).join('');
  let done={};try{done=JSON.parse(localStorage.getItem('fe2e-ex')||'{}');}catch(e){}
  $('ex').innerHTML=EX.map(([t,id],i)=>`<li><input type="checkbox" id="ex${i}"${done[i]?' checked':''}><label for="ex${i}">${t}</label><a href="#${id}">Watch it →</a></li>`).join('');
  $('ex').addEventListener('change',e=>{done[e.target.id.slice(2)]=e.target.checked;try{localStorage.setItem('fe2e-ex',JSON.stringify(done));}catch(e){}});
})();
$('nav').addEventListener('click',e=>{const b=e.target.closest('button');if(b){open(b.dataset.id,true);}});
$('bPlay').onclick=()=>playing?stop():play();
$('bStep').onclick=()=>{stop();if(k<cur.steps.length-1)show(k+1,true);};
$('bBack').onclick=()=>{stop();if(k>=0)show(k-1,false);};
$('bReset').onclick=()=>{stop();show(-1,false);};
$('bNext').onclick=()=>{const ix=LESSONS.indexOf(cur);if(ix<LESSONS.length-1){open(LESSONS[ix+1].id,true);window.scrollTo({top:0,behavior:still?'auto':'smooth'});}};
$('speed').onchange=e=>{speed=+e.target.value;};
const jump=e=>{const r=e.target.closest('tr');if(r){stop();show(+r.dataset.i,false);}};
$('rows').addEventListener('click',jump);
$('rows').addEventListener('keydown',e=>{if(e.key==='Enter')jump(e);});
document.addEventListener('keydown',e=>{if(/SELECT|INPUT|BUTTON/.test(e.target.tagName))return;
  if(e.key==='ArrowRight')$('bStep').click();else if(e.key==='ArrowLeft')$('bBack').click();});
addEventListener('hashchange',()=>{const id=location.hash.slice(1);if(id&&id!==cur.id){open(id,true);window.scrollTo(0,0);}});
open(location.hash.slice(1),true);
</script>
</body>
